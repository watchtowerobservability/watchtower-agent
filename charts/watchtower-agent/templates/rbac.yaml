{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "wta.name" . }}
  labels: {{- include "wta.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/stats, pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "wta.name" . }}
  labels: {{- include "wta.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "wta.name" . }} }
subjects:
  - { kind: ServiceAccount, name: {{ include "wta.sa" . }}, namespace: {{ .Release.Namespace }} }
{{- end }}
