name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Cross-build
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o "dist/wt-agent-$os-$arch$ext" ./agent
            case $os in
              windows) (cd dist && cp "wt-agent-$os-$arch.exe" wt-agent.exe && zip -q "wt-agent-$os-$arch.zip" wt-agent.exe && rm wt-agent.exe "wt-agent-$os-$arch.exe") ;;
              *) (cd dist && cp "wt-agent-$os-$arch" wt-agent && tar -czf "wt-agent-$os-$arch.tar.gz" wt-agent && rm wt-agent) ;;
            esac
          done
      - name: Packages (deb, rpm)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          sed -i 's/license: Proprietary/license: Apache-2.0/' infra/agent/nfpm.yaml
          for arch in amd64 arm64; do
            # nfpm reads the raw binary; unpack it from the tarball built above.
            tar -xzf "dist/wt-agent-linux-$arch.tar.gz" -C dist && mv dist/wt-agent "dist/wt-agent-linux-$arch"
            for fmt in deb rpm; do
              ARCH=$arch VERSION=$VERSION "$(go env GOPATH)/bin/nfpm" package -f infra/agent/nfpm.yaml -p $fmt -t dist/
            done
            rm "dist/wt-agent-linux-$arch"
          done
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/watchtowerobservability/agent:${{ github.ref_name }}
            ghcr.io/watchtowerobservability/agent:latest
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/watchtowerobservability/agent
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push OCI chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/watchtower-agent --version "$VERSION" --app-version "$VERSION"
          helm push "watchtower-agent-$VERSION.tgz" oci://ghcr.io/watchtowerobservability/charts
