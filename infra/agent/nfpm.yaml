# Built by scripts/agent-packages.sh: VERSION and ARCH come from the environment.
name: wt-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Watchtower <ops@watchtower.example>
description: Watchtower host agent (host, container and custom-check collection over OTLP).
license: Proprietary
contents:
  - src: dist/wt-agent-linux-${ARCH}
    dst: /usr/bin/wt-agent
    file_info:
      mode: 0755
  - src: infra/agent/wt-agent.service
    dst: /usr/lib/systemd/system/wt-agent.service
  - src: infra/agent/agent.example.yaml
    dst: /etc/wt-agent/agent.yaml
    type: config|noreplace
    file_info:
      mode: 0640
      group: wt-agent
  - dst: /var/lib/wt-agent
    type: dir
    file_info:
      mode: 0750
      owner: wt-agent
      group: wt-agent
scripts:
  preinstall: infra/agent/preinstall.sh
  postinstall: infra/agent/postinstall.sh
