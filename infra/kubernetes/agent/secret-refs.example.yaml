# Opt-in, not part of kustomization.yaml: lets the agent resolve ${k8s:monitoring/db-credentials#password}.
# Copy per namespace and list only the secrets the agent config references. Keep it to get with
# resourceNames: the agents never get list, watch or cluster-wide read on secrets.
# Bind whichever agent runs the module (wt-agent-node or wt-agent-cluster).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wt-agent-secret-refs
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["db-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wt-agent-secret-refs
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wt-agent-secret-refs
subjects:
  - kind: ServiceAccount
    name: wt-agent-cluster
    namespace: watchtower-agent
