name: mssql
version: "1.0.0"
discovery:
  process_names: ["sqlservr", "sqlservr.exe"]
  ports: [1433]
  k8s_labels: {"app.kubernetes.io/name": "mssql"}
module:
  kind: mssql
  config_defaults: {"url": "http://127.0.0.1:9399/metrics", "interval": "30s"}
metrics:
  - {name: "mssql_up", unit: "1", description: "1 while the exporter reaches SQL Server."}
  - {name: "mssql_connections", unit: "{connections}", description: "Connections per database."}
  - {name: "mssql_deadlocks", unit: "{deadlocks}", description: "Deadlocks (cumulative)."}
  - {name: "mssql_io_stall_seconds", unit: "s", description: "IO stall time per database and operation."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "mssql_up", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"mssql_up\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "mssql unreachable"
    rule: {"name": "mssql unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"mssql\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "mssql unreachable", "runbook_url": ""}}
    threshold_rationale: "The mssql collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
