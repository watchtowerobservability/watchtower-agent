name: cassandra
version: "1.0.0"
discovery:
  process_names: ["cassandra", "CassandraDaemon"]
  ports: [9042]
  k8s_labels: {"app.kubernetes.io/name": "cassandra"}
module:
  kind: cassandra
  config_defaults: {"url": "http://127.0.0.1:8080/metrics", "interval": "30s"}
metrics:
  - {name: "cassandra_stats", unit: "1", description: "Node stats from the cassandra-exporter."}
  - {name: "cassandra_table_pending_compactions", unit: "{tasks}", description: "Pending compactions per table."}
  - {name: "cassandra_dropped_messages_total", unit: "{messages}", description: "Dropped messages by type (cumulative)."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "cassandra_stats", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"cassandra_stats\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "cassandra unreachable"
    rule: {"name": "cassandra unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"cassandra\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "cassandra unreachable", "runbook_url": ""}}
    threshold_rationale: "The cassandra collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
