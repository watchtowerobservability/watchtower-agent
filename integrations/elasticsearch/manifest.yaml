name: elasticsearch
version: "1.0.0"
discovery:
  process_names: ["elasticsearch", "opensearch"]
  ports: [9200]
  k8s_labels: {"app.kubernetes.io/name": "elasticsearch"}
module:
  kind: http_status
  config_defaults: {"targets": [{"kind": "elasticsearch", "url": "http://127.0.0.1:9200/_cluster/health", "service": "elasticsearch"}], "interval": "30s"}
metrics:
  - {name: "elasticsearch.cluster.status", unit: "1", description: "0 green, 1 yellow, 2 red."}
  - {name: "elasticsearch.cluster.nodes", unit: "{nodes}", description: "Nodes in the cluster."}
  - {name: "elasticsearch.shards.unassigned", unit: "{shards}", description: "Unassigned shards."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "Cluster status", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"elasticsearch.cluster.status\"})"}, "options": {"unit": "short"}}, {"id": "p1", "title": "Unassigned shards", "type": "timeseries", "grid": {"x": 12, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"elasticsearch.shards.unassigned\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "Elasticsearch cluster red"
    rule: {"name": "Elasticsearch cluster red", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"elasticsearch.cluster.status\"})"}, "condition": {"threshold": {"op": "ge", "value": 2}}, "every_s": 60, "window_s": 300, "for_s": 120, "severity": "critical", "no_data": "ok", "labels": {}, "annotations": {"summary": "Elasticsearch cluster red", "runbook_url": "https://docs.watchtower.example/runbooks/elasticsearch-red"}}
    threshold_rationale: "Red means at least one primary shard is missing: data is unavailable."
    runbook_url: "https://docs.watchtower.example/runbooks/elasticsearch-red"
    default_enabled: true
  - name: "Elasticsearch cluster yellow"
    rule: {"name": "Elasticsearch cluster yellow", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"elasticsearch.cluster.status\"})"}, "condition": {"threshold": {"op": "ge", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 900, "severity": "warning", "no_data": "ok", "labels": {}, "annotations": {"summary": "Elasticsearch cluster yellow", "runbook_url": "https://docs.watchtower.example/runbooks/elasticsearch-yellow"}}
    threshold_rationale: "Yellow means replicas are unassigned: redundancy is lost. 15 minutes lets a rolling restart finish."
    runbook_url: "https://docs.watchtower.example/runbooks/elasticsearch-yellow"
    default_enabled: true
  - name: "elasticsearch unreachable"
    rule: {"name": "elasticsearch unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"elasticsearch\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "elasticsearch unreachable", "runbook_url": ""}}
    threshold_rationale: "The elasticsearch collector failed every round for 3 minutes: the product is down, refusing connections, or the agent's credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
