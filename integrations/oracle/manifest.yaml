name: oracle
version: "1.0.0"
discovery:
  process_names: ["oracle", "tnslsnr"]
  ports: [1521]
  k8s_labels: {"app.kubernetes.io/name": "oracle"}
module:
  kind: oracle
  config_defaults: {"url": "http://127.0.0.1:9161/metrics", "interval": "30s"}
metrics:
  - {name: "oracledb_up", unit: "1", description: "1 while the exporter reaches Oracle."}
  - {name: "oracledb_sessions_value", unit: "{sessions}", description: "Sessions by status and type."}
  - {name: "oracledb_tablespace_free", unit: "By", description: "Free bytes per tablespace."}
  - {name: "oracledb_resource_current_utilization", unit: "1", description: "Current utilization per resource."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "oracledb_up", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"oracledb_up\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "oracle unreachable"
    rule: {"name": "oracle unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"oracle\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "oracle unreachable", "runbook_url": ""}}
    threshold_rationale: "The oracle collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
