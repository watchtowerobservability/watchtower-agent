name: pulsar
version: "1.0.0"
discovery:
  process_names: ["pulsar", "org.apache.pulsar.PulsarBrokerStarter"]
  ports: [8080]
  k8s_labels: {"app.kubernetes.io/name": "pulsar"}
module:
  kind: pulsar
  config_defaults: {"url": "http://127.0.0.1:8080", "interval": "30s"}
metrics:
  - {name: "pulsar_msg_backlog", unit: "{messages}", description: "Backlog per topic."}
  - {name: "pulsar_rate_in", unit: "{messages}/s", description: "Messages per second in, per topic."}
  - {name: "pulsar_subscriptions_count", unit: "{subscriptions}", description: "Subscriptions per topic."}
dashboards:
  - {"version": 1, "variables": [], "panels": [{"id": "p0", "title": "pulsar_msg_backlog", "type": "timeseries", "grid": {"x": 0, "y": 0, "w": 12, "h": 8}, "query": {"kind": "promql", "text": "max by (host_name) ({__name__=\"pulsar_msg_backlog\"})"}, "options": {"unit": "short"}}]}
alerts:
  - name: "pulsar unreachable"
    rule: {"name": "pulsar unreachable", "kind": "metric", "query": {"promql": "max by (host_name) ({__name__=\"wt.integration.up\", integration=\"pulsar\"})"}, "condition": {"threshold": {"op": "lt", "value": 1}}, "every_s": 60, "window_s": 300, "for_s": 180, "severity": "high", "no_data": "ok", "labels": {}, "annotations": {"summary": "pulsar unreachable", "runbook_url": ""}}
    threshold_rationale: "The pulsar collector failed every round for 3 minutes: the product or exporter is down, or the agent's address or credentials are wrong."
    runbook_url: ""
    default_enabled: true
depends_on: [{"parent_kind": "host", "equal_labels": ["host_name"]}]
